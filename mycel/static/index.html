<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mycel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B2220'/%3E%3Cg stroke='%2363C3A8' stroke-width='2.2' fill='none'%3E%3Cpath d='M9 22l7-12 7 12M9 22h14'/%3E%3C/g%3E%3Cg fill='%2363C3A8'%3E%3Ccircle cx='16' cy='10' r='3'/%3E%3Ccircle cx='9' cy='22' r='3'/%3E%3Ccircle cx='23' cy='22' r='3'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <nav class="rail" aria-label="機能">
    <button class="rbtn on" data-panel="files" title="ファイル (Ctrl+Shift+E)"><svg viewBox="0 0 24 24"><path d="M3 6.5h7l2 2h9V19H3z"/></svg></button>
    <button class="rbtn" data-panel="search" title="全文検索 (Ctrl+Shift+F)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg></button>
    <button class="rbtn" data-panel="tags" title="タグ"><svg viewBox="0 0 24 24"><path d="M4 12V4h8l8 8-8 8z"/><circle cx="8.5" cy="8.5" r="1.4"/></svg></button>
    <button class="rbtn" data-panel="people" title="人物・組織"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c.6-3 2.8-4.6 5.5-4.6s4.9 1.6 5.5 4.6"/><circle cx="17" cy="9" r="2.3"/><path d="M15.8 14.2c2.3-.2 4.2 1.2 4.7 3.8"/></svg></button>
    <button class="rbtn" data-panel="recent" title="最近の変更"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></svg></button>
    <button class="rbtn" id="btnDaily" title="今日のデイリーノート (Ctrl+D)"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></button>
    <button class="rbtn" id="btnLibrary" title="文書・文献管理モード（報告書・論文）"><svg viewBox="0 0 24 24"><path d="M4 5h5a3 3 0 013 3v12a2 2 0 00-2-2H4zM20 5h-5a3 3 0 00-3 3v12a2 2 0 012-2h6z"/></svg></button>
    <button class="rbtn" id="btnIngest" title="AI 取り込み（文書をつながったノートにする）"><svg viewBox="0 0 24 24"><path d="M4 13h4l1.5 3h5L16 13h4"/><path d="M4 13l2.5-7h11L20 13v6H4z"/><path d="M12 3v6M9.5 6.5 12 9l2.5-2.5"/></svg></button>
    <button class="rbtn" id="btnScope" title="読み込み範囲と更新"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="2.6"/><path d="M5 6v12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V6M5 12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6"/></svg></button>
    <button class="rbtn" id="btnGraph" title="グラフ（Vault 全体）"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 8l3 8M16 8l-3 8M8.5 7h7"/></svg></button>
    <div class="sp"></div>
    <button class="rbtn" id="btnTheme" title="ライト / ダーク切り替え"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg></button>
    <button class="rbtn" id="btnSettings" title="設定"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
  </nav>

  <aside class="side" id="side">
    <section data-pane="files" class="pane" style="display:flex;flex-direction:column;min-height:0;flex:1">
      <div class="phead"><span class="t">ファイル</span>
        <button class="ibtn" id="btnVault" title="Vault を切り替える"><svg viewBox="0 0 24 24"><path d="M4 7h16v12H4z"/><path d="M4 7l2-3h12l2 3"/><path d="M9 12h6"/></svg></button>
        <button class="ibtn" id="btnNewNote" title="新しいノート (Alt+N)"><svg viewBox="0 0 24 24"><path d="M14 3H6v18h12V7z"/><path d="M12 11v6M9 14h6"/></svg></button>
        <button class="ibtn" id="btnFolderView" title="フォルダの一覧を開く"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <button class="ibtn" id="btnNewFolder" title="新しいフォルダ"><svg viewBox="0 0 24 24"><path d="M3 6.5h7l2 2h9V19H3z"/><path d="M12 11v5M9.5 13.5h5"/></svg></button>
        <button class="ibtn" id="btnCollapse" title="すべて折りたたむ"><svg viewBox="0 0 24 24"><path d="M7 9l5-5 5 5M7 15l5 5 5-5"/></svg></button>
      </div>
      <div class="seg tkind" id="treeKind" role="group" aria-label="表示する種類"><button data-k="all">すべて</button><button data-k="note">ノート</button><button data-k="doc">資料</button></div>
      <input class="field-in" id="filter" type="search" placeholder="ノート・資料の名前で絞り込み" aria-label="ノート・資料の名前で絞り込み">
      <div class="scroll tree" id="tree"></div>
    </section>
    <section data-pane="search" class="pane" hidden style="flex-direction:column;min-height:0;flex:1">
      <div class="phead"><span class="t">全文検索</span></div>
      <input class="field-in" id="searchIn" type="search" placeholder="キーワード（スペースで AND）" aria-label="全文検索">
      <div class="scroll" id="searchRes"></div>
    </section>
    <section data-pane="tags" class="pane" hidden style="flex-direction:column;min-height:0;flex:1">
      <div class="phead"><span class="t">タグ</span></div>
      <div class="scroll" id="tagList"></div>
    </section>
    <section data-pane="people" class="pane" hidden style="flex-direction:column;min-height:0;flex:1">
      <div class="phead"><span class="t">人物・組織</span></div>
      <div class="seg tkind" id="peopleKind" role="group" aria-label="種類"><button data-k="person">人物</button><button data-k="org">組織</button></div>
      <input class="field-in" id="peopleQ" type="search" placeholder="名前で絞り込み" aria-label="名前で絞り込み">
      <div class="scroll" id="peopleList"></div>
      <div class="pfoot" id="peopleFoot"></div>
    </section>
    <section data-pane="recent" class="pane" hidden style="flex-direction:column;min-height:0;flex:1">
      <div class="phead"><span class="t">最近の変更</span></div>
      <div class="scroll" id="recentList"></div>
    </section>
  </aside>

  <main class="main" id="main">
    <div class="topbar">
      <span class="crumb" id="crumb"></span>
      <input class="title-in" id="titleIn" aria-label="ノート名（Enter で名前を変更）" disabled>
      <span class="ndates" id="noteDates" title=""></span>
      <div class="seg" role="group" aria-label="表示モード">
        <button id="mPrev" class="on">閲覧</button><button id="mEdit">編集</button>
      </div>
      <button class="ibtn" id="btnMore" title="その他の操作"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
      <button class="ibtn" id="btnRight" title="右パネルの表示切り替え"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
    </div>
    <div class="banner" id="conflict" hidden>
      <span>このノートは別の場所で変更されました。どちらを残しますか？</span><span class="sp"></span>
      <button class="btn sm" id="cfTheirs">相手の版を読み込む</button>
      <button class="btn sm pri" id="cfMine">自分の版で上書き</button>
    </div>
    <div class="body" id="body"></div>
    <div class="status"><span id="stIndex" class="stindex"></span><span id="stInfo"></span><span id="stWords"></span><span id="stSave"><span class="dot"></span>保存済み</span><span id="stVer" class="stver" title="Mycel の版"></span></div>
  </main>

  <aside class="right" id="right">
    <div class="rtabs" role="tablist">
      <button data-r="links" class="on">リンク</button>
      <button data-r="graph">グラフ</button>
      <button data-r="ai">AI</button>
    </div>
    <div class="rpane" id="rpane"></div>
  </aside>
</div>
<script src="markdown.js"></script>
<script src="graph.js"></script>
<script src="app.js"></script>
</body>
</html>
