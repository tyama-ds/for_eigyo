<div class="learning-row"><label class="learning-mode-label">学習・判定方式<select id="training-mode" aria-label="学習方式"><option value="lightweight" selected>軽量学習 · TF-IDF</option><option value="transformer" >Transformer本体を微調整</option><option value="llm" >LLMにおまかせ</option></select></label><button class="button primary" id="train-button">学習する ↗</button><label class="check" id="include-agent-control"><input id="include-agent" type="checkbox" >エージェントの判定を含める</label><a class="button subtle small" href="/api/export/labels" download>判定をCSVで保存 ↓</a></div><div id="llm-training-options" class="llm-training-options" hidden><label>判定基準（空欄なら採用した式の目的・観点、未設定なら探索キーワード）<textarea id="llm-training-criteria" rows="2" maxlength="5000" placeholder="例：製造工程や界面の改善を含み、充電設備だけの特許は除く"></textarea></label><p id="llm-training-used-criteria" class="caption" hidden></p><div class="llm-training-limits"><label>今回判定する上限<input id="llm-training-limit" type="number" min="1" max="5000" step="1" value="100"></label><label>判定を採用する信頼度<input id="llm-training-threshold" type="number" min="0.5" max="1" step="0.05" value="0.8"></label></div><p class="caption">設定したLLMへタイトル・要約・IPCと判定例を渡します。採用した式があれば目的・観点も参照し、入力した判定基準を優先します。人の確定判定を優先し、低信頼の回答は保留。LLMの重みは学習しません。</p></div><p id="learning-mode-note" class="caption learning-mode-note"></p><div id="learning-progress" class="learning-progress" hidden><div class="learning-progress-heading"><div><b id="learning-progress-status"></b></div><strong id="learning-progress-percent">0%</strong></div><progress id="map-training-progress" max="100" value="0" aria-label="学習・判定の進捗"></progress><p id="learning-progress-message" role="status"></p><div class="learning-progress-bottom"><small id="learning-progress-count"></small><button id="map-training-stop" class="button small subtle" hidden>停止する</button></div><p id="learning-progress-error" class="learning-error" hidden></p><small class="caption">割合は処理工程の目安です。LLMの応答待ち・モデル読込中は進捗が止まる場合があります。</small></div>
