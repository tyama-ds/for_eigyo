<title>for_eigyo 開発ボード</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- このファイルは progress/build_dashboard.py が生成します。直接編集せず progress/projects/*.json を更新してください。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #F3F5F8; --surface: #FFFFFF; --ink: #16202E; --ink-2: #4A5669; --muted: #6F7A8C;
  --rule: #DCE1E8; --accent: #2B5C8F; --accent-soft: #E3ECF6; --track: #E4E9F0; --focus: #2B5C8F;
  --s-active: #1F8A4C; --s-planning: #6A5BB0; --s-maintenance: #2B6CB0; --s-paused: #A86A12; --s-done: #6B7280;
  --warn: #9A5B00; --warn-bg: #FFF1D6;
  --sans: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0F141B; --surface: #171E27; --ink: #E5EAF1; --ink-2: #B3BDCB; --muted: #8793A5;
    --rule: #28323F; --accent: #86AEDB; --accent-soft: #1D2B3C; --track: #253040; --focus: #86AEDB;
    --s-active: #4CC27E; --s-planning: #A99BEA; --s-maintenance: #6FA5E0; --s-paused: #E3A948; --s-done: #9AA3AF;
    --warn: #F0B454; --warn-bg: #3A2B12;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0F141B; --surface: #171E27; --ink: #E5EAF1; --ink-2: #B3BDCB; --muted: #8793A5;
  --rule: #28323F; --accent: #86AEDB; --accent-soft: #1D2B3C; --track: #253040; --focus: #86AEDB;
  --s-active: #4CC27E; --s-planning: #A99BEA; --s-maintenance: #6FA5E0; --s-paused: #E3A948; --s-done: #9AA3AF;
  --warn: #F0B454; --warn-bg: #3A2B12;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.65 var(--sans); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 32px 20px 56px; display: grid; gap: 24px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
header h1 { font-size: 28px; font-weight: 700; letter-spacing: .01em; margin-top: 8px; }
.asof { color: var(--ink-2); font-size: 13px; }
.asof b { font: 500 13px var(--mono); color: var(--ink); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* 集計 */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px;
  background: var(--rule); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.tile { background: var(--surface); padding: 14px 16px; display: grid; gap: 4px; }
.tile .label { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.tile .value { font: 500 26px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.tile .value small { font-size: 13px; color: var(--muted); margin-left: 2px; }

/* フィルター */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { font: 500 13px var(--sans); color: var(--ink-2); background: var(--surface); border: 1px solid var(--rule);
  border-radius: 999px; padding: 5px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.chip .count { font-family: var(--mono); color: var(--muted); }
.search { margin-left: auto; min-width: 0; flex: 0 1 240px; font: 14px var(--sans); color: var(--ink);
  background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* 状態の表示 */
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--ink);
  border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
  background: color-mix(in srgb, var(--c) 12%, var(--surface)); border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
[data-s="active"] { --c: var(--s-active); } [data-s="planning"] { --c: var(--s-planning); }
[data-s="maintenance"] { --c: var(--s-maintenance); } [data-s="paused"] { --c: var(--s-paused); }
[data-s="done"] { --c: var(--s-done); }
.stale { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--warn); background: var(--warn-bg);
  border-radius: 4px; padding: 0 6px; white-space: nowrap; }

/* 一覧 */
.list { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
.head, .row { display: grid; grid-template-columns: minmax(180px, 1.3fr) 96px minmax(160px, 1.6fr) 150px 110px 20px;
  gap: 16px; align-items: center; padding: 12px 16px; }
.head { font-size: 11px; color: var(--muted); letter-spacing: .06em; border-bottom: 1px solid var(--rule); }
details + details { border-top: 1px solid var(--rule); }
summary { list-style: none; cursor: pointer; }
summary::-webkit-details-marker { display: none; }
summary:hover { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
.name b { display: block; font-size: 15px; }
.name code { font: 12px var(--mono); color: var(--muted); }
.phase { color: var(--ink-2); font-size: 13px; }
.meter { display: grid; grid-template-columns: 1fr 38px; gap: 8px; align-items: center; }
.bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--c); }
.meter .num { font-size: 13px; text-align: right; }
.upd { font: 13px var(--mono); color: var(--ink-2); display: grid; gap: 2px; justify-items: start; }
.chev { color: var(--muted); transition: transform .15s; }
details[open] .chev { transform: rotate(90deg); }

/* 詳細 */
.detail { padding: 4px 16px 20px; display: grid; gap: 18px; grid-template-columns: 1.1fr 1fr; }
.detail > .full { grid-column: 1 / -1; }
.detail p { margin: 0; max-width: 68ch; color: var(--ink-2); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.meta span b { color: var(--ink-2); font-weight: 500; }
.block h3 { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .06em; margin-bottom: 8px; }
.block ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.ms li { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: baseline; }
.ms .mark { font: 13px var(--mono); text-align: center; }
.ms [data-m="done"] .mark { color: var(--s-active); }
.ms [data-m="doing"] .mark { color: var(--accent); }
.ms [data-m="todo"] .mark { color: var(--muted); }
.ms [data-m="todo"] .t { color: var(--ink-2); }
.ms .d { font: 12px var(--mono); color: var(--muted); }
.bul li { padding-left: 14px; position: relative; color: var(--ink-2); }
.bul li::before { content: ""; position: absolute; left: 2px; top: .7em; width: 5px; height: 1px; background: var(--muted); }
.log { overflow-x: auto; }
.log table { border-collapse: collapse; width: 100%; font-size: 13px; }
.log td { padding: 6px 12px 6px 0; border-top: 1px solid var(--rule); vertical-align: top; }
.log td:first-child { font-family: var(--mono); color: var(--muted); white-space: nowrap; width: 1%; }
.log td.ref { font-family: var(--mono); color: var(--muted); white-space: nowrap; text-align: right; }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); }
footer { font-size: 12px; color: var(--muted); }
footer code { font-family: var(--mono); }

@media (max-width: 820px) {
  .head { display: none; }
  .row { grid-template-columns: 1fr auto; gap: 6px 12px; }
  .row .name { grid-column: 1; } .row .st { grid-column: 2; grid-row: 1; justify-self: end; }
  .row .phase, .row .meter { grid-column: 1 / -1; }
  .row .upd { grid-column: 1; display: flex; gap: 8px; align-items: center; }
  .row .chev { grid-column: 2; grid-row: 4; justify-self: end; }
  .detail { grid-template-columns: 1fr; }
  .search { margin-left: 0; flex: 1 1 100%; }
}
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">tyama-ds / for_eigyo</div>
      <h1>開発ボード</h1>
    </div>
    <div class="asof">最終更新 <b id="asof"></b></div>
  </header>

  <section class="summary" id="summary" aria-label="集計"></section>

  <div class="filters" role="group" aria-label="状態で絞り込む">
    <div id="chips" style="display:contents"></div>
    <input class="search" id="q" type="search" placeholder="プロジェクト名・内容で検索" aria-label="検索">
  </div>

  <section class="list" aria-label="プロジェクト一覧">
    <div class="head" aria-hidden="true">
      <span>プロジェクト</span><span>状態</span><span>現在のフェーズ</span><span>進捗</span><span>最終更新</span><span></span>
    </div>
    <div id="rows"></div>
  </section>

  <footer>進捗は <code>progress/projects/*.json</code> を正本とし、<code>progress/build_dashboard.py</code> で生成しています。進捗率は完了したマイルストーンと残作業からの目安です。</footer>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById("data").textContent);
  var S = D.statuses, P = D.projects;
  var ORDER = ["active", "planning", "maintenance", "paused", "done"];
  var state = { status: "all", q: "" };
  try { var saved = localStorage.getItem("board-filter"); if (saved && (saved === "all" || S[saved])) state.status = saved; } catch (e) {}

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function days(a, b) { return Math.round((Date.parse(b) - Date.parse(a)) / 864e5); }
  var today = new Date().toISOString().slice(0, 10);
  function isStale(p) { return (p.status === "active" || p.status === "planning") && days(p.updated, today) > D.staleDays; }

  document.getElementById("asof").textContent = D.asOf;

  // 集計
  var active = P.filter(function (p) { return p.status !== "done"; });
  var avg = active.length ? Math.round(active.reduce(function (s, p) { return s + p.progress; }, 0) / active.length) : 0;
  var open = P.reduce(function (s, p) { return s + p.milestones.filter(function (m) { return m.state !== "done"; }).length; }, 0);
  var tiles = [["プロジェクト", P.length, "件"]];
  ORDER.forEach(function (k) { var n = P.filter(function (p) { return p.status === k; }).length; if (n) tiles.push([S[k], n, "件", k]); });
  tiles.push(["平均進捗（完了を除く）", avg, "%"], ["残りのマイルストーン", open, "件"]);
  document.getElementById("summary").innerHTML = tiles.map(function (t) {
    return '<div class="tile"><span class="label">' + (t[3] ? '<span class="dot" data-s="' + t[3] + '"></span>' : "") + esc(t[0]) +
      '</span><span class="value">' + t[1] + "<small>" + t[2] + "</small></span></div>";
  }).join("");

  // フィルター
  var chipsEl = document.getElementById("chips");
  function renderChips() {
    var list = [["all", "すべて", P.length]];
    ORDER.forEach(function (k) { var n = P.filter(function (p) { return p.status === k; }).length; if (n) list.push([k, S[k], n]); });
    chipsEl.innerHTML = list.map(function (c) {
      return '<button type="button" class="chip" id="chip-' + c[0] + '" data-k="' + c[0] + '" aria-pressed="' + (state.status === c[0]) + '">' +
        (c[0] !== "all" ? '<span class="dot" data-s="' + c[0] + '"></span>' : "") + esc(c[1]) + ' <span class="count">' + c[2] + "</span></button>";
    }).join("");
  }
  chipsEl.addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (!b) return;
    state.status = b.dataset.k;
    try { localStorage.setItem("board-filter", state.status); } catch (err) {}
    renderChips(); renderRows();
  });
  document.getElementById("q").addEventListener("input", function (e) { state.q = e.target.value.trim().toLowerCase(); renderRows(); });

  var MARK = { done: "✓", doing: "▸", todo: "○" };
  function row(p) {
    var ms = p.milestones.map(function (m) {
      return '<li data-m="' + m.state + '"><span class="mark" aria-label="' + ({ done: "完了", doing: "進行中", todo: "未着手" })[m.state] + '">' + MARK[m.state] +
        '</span><span class="t">' + esc(m.title) + '</span><span class="d">' + esc(m.date || "") + "</span></li>";
    }).join("");
    var bul = function (xs) { return xs.length ? '<ul class="bul">' + xs.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : '<p>なし</p>'; };
    var log = p.log.map(function (e) {
      return "<tr><td>" + esc(e.date) + "</td><td>" + esc(e.summary) + '</td><td class="ref">' + esc(e.ref || "") + "</td></tr>";
    }).join("");
    var meta = [];
    if (p.version) meta.push("<span>バージョン <b>" + esc(p.version) + "</b></span>");
    if (p.ports && p.ports.length) meta.push('<span>ポート <b class="num">' + p.ports.map(esc).join(", ") + "</b></span>");
    if (p.stack && p.stack.length) meta.push("<span>構成 <b>" + p.stack.map(esc).join(" / ") + "</b></span>");
    meta.push("<span>CI <b>" + (p.ci ? "あり" : "なし") + "</b></span>");
    meta.push("<span>App Portal <b>" + (p.portal ? "登録済み" : "対象外") + "</b></span>");
    meta.push('<span>開始 <b class="num">' + esc(p.started) + "</b></span>");
    var stale = isStale(p) ? '<span class="stale" title="' + D.staleDays + '日以上更新がありません">! ' + days(p.updated, today) + "日更新なし</span>" : "";
    return '<details id="p-' + esc(p.slug) + '"><summary class="row" data-s="' + p.status + '">' +
      '<span class="name"><b>' + esc(p.name) + "</b><code>" + esc(p.path) + "</code></span>" +
      '<span class="st"><span class="pill"><span class="dot"></span>' + esc(S[p.status]) + "</span></span>" +
      '<span class="phase">' + esc(p.phase) + "</span>" +
      '<span class="meter" title="進捗の目安 ' + p.progress + '%"><span class="bar" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + p.progress + '" aria-label="進捗"><i style="width:' + p.progress + '%"></i></span><span class="num">' + p.progress + "%</span></span>" +
      '<span class="upd">' + esc(p.updated) + stale + "</span>" +
      '<span class="chev" aria-hidden="true">›</span></summary>' +
      '<div class="detail"><div class="full" style="display:grid;gap:8px"><p>' + esc(p.summary) + '</p><div class="meta">' + meta.join("") + "</div></div>" +
      '<div class="block"><h3>マイルストーン</h3><ul class="ms">' + (ms || "<li>なし</li>") + "</ul></div>" +
      '<div class="block" style="display:grid;gap:16px"><div><h3>次にやること</h3>' + bul(p.next) + "</div><div><h3>課題・リスク</h3>" + bul(p.risks) + "</div></div>" +
      '<div class="block full log"><h3>作業ログ</h3><table><tbody>' + log + "</tbody></table></div></div></details>";
  }
  function renderRows() {
    var xs = P.filter(function (p) {
      if (state.status !== "all" && p.status !== state.status) return false;
      if (!state.q) return true;
      return [p.name, p.path, p.summary, p.phase].concat(p.stack || []).join(" ").toLowerCase().indexOf(state.q) >= 0;
    });
    document.getElementById("rows").innerHTML = xs.length ? xs.map(row).join("") : '<div class="empty">条件に合うプロジェクトはありません。</div>';
    var h = location.hash.slice(1);
    if (h) { var el = document.getElementById(h); if (el && el.tagName === "DETAILS") el.open = true; }
  }
  renderChips(); renderRows();
})();
</script>
