name: patent-atlas tests

on:
  push:
    paths: ["patent-atlas/**", "launcher/**", ".github/workflows/patent-atlas.yml"]
  pull_request:
    paths: ["patent-atlas/**", "launcher/**", ".github/workflows/patent-atlas.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: patent-atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: patent-atlas/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install core dependencies
        run: python -m pip install -r requirements.txt
      - name: Python unit and API tests with simulated LLM responses
        run: python -m unittest discover -s tests -v
      - name: JavaScript UI tests
        run: node --test tests/*.test.cjs
      - name: Portal integration tests
        run: python -m unittest discover -s ../launcher -p 'test_patent_launcher.py' -v
