# doc-vault のテスト（モック LLM で実 LLM 不要。PDF の抽出テストのため pypdf だけ入れる）。
name: doc-vault tests

on:
  push:
    paths: ["doc-vault/**", "rag-orchestrator/graphview.js", ".github/workflows/doc-vault.yml"]
  pull_request:
    paths: ["doc-vault/**", "rag-orchestrator/graphview.js", ".github/workflows/doc-vault.yml"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: doc-vault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional deps
        run: python -m pip install pypdf
      - name: Compileall
        run: python -m compileall -q docvault server.py tests
      - name: Unit + API tests
        run: python -m unittest discover -s tests -v
