name: research-atlas tests

on:
  push:
    paths: ["research-atlas/**", "launcher/launcher.py", "launcher/apps.json", "launcher/test*.py", ".github/workflows/research-atlas.yml"]
  pull_request:
    paths: ["research-atlas/**", "launcher/launcher.py", "launcher/apps.json", "launcher/test*.py", ".github/workflows/research-atlas.yml"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research-atlas
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research-atlas/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install base dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare Japanese font for PDF tests
        shell: python
        run: |
          import hashlib, io, os, pathlib, urllib.request, zipfile
          url = "https://moji.or.jp/wp-content/ipafont/IPAexfont/ipaexg00401.zip"
          with urllib.request.urlopen(url, timeout=60) as response:
              data = response.read(15_000_001)
          expected = "4ab6fee94bf6f94b3eeb31be2b73c559f738dc6b336d722d5301b1f3f592f850"
          if hashlib.sha256(data).hexdigest() != expected:
              raise RuntimeError("Unexpected IPAex Gothic archive checksum")
          folder = pathlib.Path(os.environ["RUNNER_TEMP"]) / "atlas-pdf-font"
          folder.mkdir(exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              for name in archive.namelist():
                  if name.endswith(("/ipaexg.ttf", "/IPA_Font_License_Agreement_v1.0.txt")):
                      (folder / pathlib.PurePosixPath(name).name).write_bytes(archive.read(name))
          font = folder / "ipaexg.ttf"
          if not font.is_file():
              raise RuntimeError("IPAex Gothic font is missing")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("ATLAS_PDF_FONT=" + font.as_posix() + "\n")
              output.write("ATLAS_DATA_DIR=" + (pathlib.Path(os.environ["RUNNER_TEMP"]) / "atlas-test-data").as_posix() + "\n")
      - name: Python analysis and API tests
        run: python -m pytest tests -q
      - name: App Portal integration tests
        run: python -m unittest discover -s ../launcher -p "test*.py" -v
      - name: JavaScript tests
        run: node --test tests/*.mjs
