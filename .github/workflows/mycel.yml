# mycel のテスト（標準ライブラリのみ・モック LLM で実 LLM 不要）。
name: mycel tests

on:
  push:
    paths: ["mycel/**", ".github/workflows/mycel.yml"]
  pull_request:
    paths: ["mycel/**", ".github/workflows/mycel.yml"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: mycel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compileall
        run: python -m compileall -q mycelcore plugins server.py tests
      - name: Unit + API tests
        run: python -m unittest discover -s tests -v
