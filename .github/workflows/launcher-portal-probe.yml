name: launcher portal probe (temporary)

on:
  push:
    branches: [claude/app-launcher-portal-8zgtko]
    paths: [".github/workflows/launcher-portal-probe.yml", "launcher/**"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the real portal from a "Download ZIP" layout without git
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          # 「Download ZIP」と同じ形（.git なし・リポジトリのバイト列そのまま）で展開
          git archive --format=zip --prefix=for_eigyo-main/ HEAD -o "$env:RUNNER_TEMP\main.zip"
          $root = Join-Path $env:RUNNER_TEMP "zip 展開 日本語"
          Expand-Archive "$env:RUNNER_TEMP\main.zip" -DestinationPath $root -Force
          $launcher = Join-Path $root "for_eigyo-main\launcher"
          # git を PATH から外す（git の入っていない PC と同じにする）
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '\\Git\\' }) -join ';'
          Write-Host ("git on PATH: " + [bool](Get-Command git -ErrorAction SilentlyContinue))
          $log = Join-Path $env:RUNNER_TEMP "portal_console.txt"
          # ダブルクリックと同じく bat 経由で起動（日本語コードページ）。ブラウザを開く代わりに API を直接叩く
          $p = Start-Process cmd.exe -ArgumentList "/d /c chcp 932 >nul & call `"$launcher\start_portal.bat`" > `"$log`" 2>&1" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 4
          foreach ($path in "/", "/api/apps", "/api/apps", "/api/layout") {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8770$path" -UseBasicParsing -TimeoutSec 30 -NoProxy
              Write-Host ("GET {0} -> {1}, {2} bytes" -f $path, $r.StatusCode, $r.RawContentLength)
              if ($path -eq "/api/apps") { Write-Host ($r.Content.Substring(0, [Math]::Min(400, $r.Content.Length))) }
            } catch {
              Write-Host ("GET {0} -> FAILED: {1}" -f $path, $_.Exception.Message)
            }
          }
          Write-Host ("portal process alive: " + (-not $p.HasExited))
          Write-Host "===== portal console ====="
          Get-Content $log -Encoding UTF8 -ErrorAction SilentlyContinue | Select-Object -First 80
          Get-Process python*, py -ErrorAction SilentlyContinue | Stop-Process -Force
